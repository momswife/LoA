    summary: "Covered trading hall where grain contracts, ration prices, and caravan deliveries are negotiated. (!)"
    description: "The Bread Exchange dominates a covered square in Hearthring where bakers, grain merchants, caravan factors, and public buyers negotiate daily prices. The surrounding lanes smell of flour, yeast, hot crust, and wagon dust."
    position:
      x: 70.43
      y: 43.71

