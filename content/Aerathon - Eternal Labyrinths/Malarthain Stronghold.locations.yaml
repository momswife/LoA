    description: "Brass Scales faces a busy commercial square in Hearthring. Merchants bring disputed goods beneath its awnings while clerks, appraisers, and curious onlookers gather around the great public balances."
    position:
      x: 50.98
      y: 45.92

  - id: "malarthain-022"
    number: 22
