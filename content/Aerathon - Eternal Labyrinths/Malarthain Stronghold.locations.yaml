    description: "Muster Yard is a broad open ground between Anvilring and the eastern approaches. Its packed earth, weapon racks, hitching posts, and signal platforms support drills, patrol formations, militia musters, and caravan departures."
    position:
      x: 69.63
      y: 54.53

