locations:
  - id: "malarthain-001"
    number: 1
    title: "Blackcrest Keep"
    category: "government-civic-authority"
    summary: "Seat of House Cardwell and the political heart of Malarthain."
    description: "Blackcrest Keep crowns the First Ring from the city’s highest natural rise. Its dark stone terraces overlook Malarthain, while guarded roads below carry petitioners, officers, household staff, and official messengers."
    position:
      x: 52.60
      y: 54.16

  - id: "malarthain-002"
    number: 2
    title: "Cardwell Archive"
    category: "government-civic-authority"
    summary: "Secured repository for royal records, mining grants, family documents, and restricted correspondence."
    description: "The Cardwell Archive occupies a quiet, closely watched wing near Blackcrest Keep. Its narrow halls, iron doors, and carefully controlled reading rooms give the area the subdued air of a place where every page matters."
    position:
      x: 55.17
      y: 53.75

  - id: "malarthain-003"
    number: 3
    title: "Great Granary"
    category: "trade-markets-food"
    summary: "Malarthain’s largest protected reserve of imported grain and emergency food."
    description: "The Great Granary stands near Hearthring’s busiest supply roads, surrounded by grain offices, guarded storehouses, and the constant rumble of delivery carts. During lean seasons, the district becomes one of the most closely watched parts of the city."
    position:
      x: 59.82
      y: 44.76

  - id: "malarthain-004"
    number: 4
    title: "Maw Fountain"
    category: "faith-shrines-memorials"
    summary: "Old beast-shaped public fountain associated with the Balval family and local offerings. (!)"
    description: "Maw Fountain sits in a broad public square near the foot of the High Hunt. Locals gather here to trade news, leave small offerings, wash dust from their hands, and meet before climbing toward the city’s sacred places."
    position:
      x: 40.97
      y: 43.82

  - id: "malarthain-005"
    number: 5
    title: "Balval Forge"
    category: "forges-artificers-magical-shops"
    summary: "Yyna’s family smithy and a respected maker of practical Malarthian metalwork."
    description: "Balval Forge rests just off the High Hunt, where temple traffic gives way to older family workshops. The surrounding lane is warm with coal smoke, hammering, and the smell of quenched iron."
    position:
      x: 37.24
      y: 46.41

  - id: "malarthain-006"
    number: 6
    title: "Twofold Anvil"
    category: "forges-artificers-magical-shops"
    summary: "Famous enchanted smithy established by twin brothers and known for paired weapons and armor. (!)"
    description: "The Twofold Anvil occupies a prominent workshop near Goldclasp and the upper forge streets. Its front windows display matched blades, mirrored armor pieces, and other paired commissions meant to be purchased together."
    position:
      x: 48.60
      y: 50.97

  - id: "malarthain-007"
    number: 7
    title: "Miners’ Union Hall"
    category: "government-civic-authority"
    summary: "Headquarters for labor organizing, accident records, worker disputes, and missing-miner advocacy. (!)"
    description: "The Miners’ Union Hall anchors a busy corner of Cinderward near several shift roads. Notices, memorial ribbons, wage postings, and family appeals cover its outer boards, making the building one of the district’s most active gathering places."
    position:
      x: 58.87
      y: 27.63

  - id: "malarthain-008"
    number: 8
    title: "Stonebreath Infirmary"
    category: "healing-gardens-public-welfare"
    summary: "Worker-supported hospital treating mining injuries, burns, lung damage, and magical exposure. (!)"
    description: "Stonebreath Infirmary stands between Cinderward and the quieter paths of the Green Run. Its open courtyards and broad intake doors are designed for injured work crews, while nearby streets remain busy with healers, relatives, and supply runners."
    position:
      x: 61.29
      y: 26.01

  - id: "malarthain-009"
    number: 9
    title: "Ministry House"
    category: "government-civic-authority"
    summary: "Malarthain’s permanent MDO liaison office and administrative foothold."
    description: "Ministry House occupies a fortified administrative building in Redwatch. The surrounding block is orderly, well lit, and heavily documented, with visiting officials, licensed couriers, and MDO personnel moving through at nearly every hour."
    position:
      x: 65.93
      y: 65.59

  - id: "malarthain-010"
    number: 10
    title: "Red Yard"
    category: "freight-travel-gates"
    summary: "Major wagon, cargo, and caravan staging yard near the eastern approach."
    description: "Red Yard spreads across a wide paved enclosure inside the eastern approach. Caravans assemble here beneath painted route boards while handlers, inspectors, guards, and freight crews sort cargo before it enters the city proper."
    position:
      x: 81.43
      y: 36.14

  - id: "malarthain-011"
    number: 11
    title: "East Weighhouse"
    category: "freight-travel-gates"
    summary: "Official weighing station for ore, metalwork, and freight leaving Malarthain."
    description: "The East Weighhouse stands beside the main freight roads of Redwatch. Its raised scales, tally windows, and covered inspection bays make the surrounding area one of the loudest and most congested parts of the eastern district."
    position:
      x: 74.37
      y: 38.25

  - id: "malarthain-012"
    number: 12
    title: "Antell House"
    category: "homes-taverns-social-life"
    summary: "Solaris’s family home, containing Maela’s workshop and the concealed Sunwarden legacy."
    description: "Antell House is built into the slope of Stonecrest Valley, with an attached workshop and a narrow view toward the brighter streets above. The neighborhood is old, close-knit, and marked by sun symbols worked into doors, lanterns, and stone."
    position:
      x: 46.64
      y: 62.47

  - id: "malarthain-013"
    number: 13
    title: "Hall of Rings"
    category: "government-civic-authority"
    summary: "Meeting hall of the Council of Rings and center of civic representation outside the keep."
    description: "The Hall of Rings occupies the meeting point between the First Ring and Hearthring. Its broad steps are rarely empty, drawing council delegates, petitioners, neighborhood representatives, and citizens hoping to be heard."
    position:
      x: 43.07
      y: 50.77

  - id: "malarthain-014"
    number: 14
    title: "The Daylight Tap"
    category: "homes-taverns-social-life"
    summary: "Solaris’s tavern and scrying hall, famous for public screenings of old delver runs. (!)"
    description: "The Daylight Tap glows from a sloping street in Stonecrest Valley, its broad windows kept open whenever weather allows. The surrounding lane fills on scrying nights with stools, food carts, loud arguments, and patrons unable to fit inside."
    position:
      x: 52.84
      y: 60.85

  - id: "malarthain-015"
    number: 15
    title: "Whitecoal House"
    category: "homes-taverns-social-life"
    summary: "Refined restaurant and private meeting place serving Malarthain’s wealthier residents. (!)"
    description: "Whitecoal House sits along the quieter edge of Goldclasp, away from the district’s noisier shops. Private dining rooms, discreet entrances, and carefully screened balconies make the surrounding block popular with officials and wealthy patrons."
    position:
      x: 48.73
      y: 57.03

  - id: "malarthain-016"
    number: 16
    title: "Acolyte Houses"
    category: "faith-shrines-memorials"
    summary: "Residences and instructional halls for priests, attendants, and religious students."
    description: "The Acolyte Houses line several sheltered lanes below the Open Maw. Students, attendants, and junior priests share gardens, kitchens, classrooms, and modest living quarters arranged around small communal courtyards."
    position:
      x: 30.75
      y: 46.93

  - id: "malarthain-017"
    number: 17
    title: "Sealed Works Office"
    category: "mining-heavy-industry"
    summary: "Administrative office responsible for collapsed shafts, abandoned tunnels, and restricted mine access."
    description: "The Sealed Works Office stands in Coldroad near the restricted western routes. Its practical stone building overlooks fenced service lanes, old mine markers, and guarded roads leading toward abandoned or condemned workings."
    position:
      x: 58.50
      y: 31.76

  - id: "malarthain-018"
    number: 18
    title: "Reserve Warehouse Nine"
    category: "mining-heavy-industry"
    summary: "Ostensible military depot secretly used to store and disguise Deep Reserve materials."
    description: "Reserve Warehouse Nine is one of several heavy depots along Coldroad. From the street it appears unremarkable: thick walls, narrow windows, wagon doors, and a small guard post serving the western storage yards."
    position:
      x: 34.32
      y: 62.77

  - id: "malarthain-019"
    number: 19
    title: "Bread Exchange"
