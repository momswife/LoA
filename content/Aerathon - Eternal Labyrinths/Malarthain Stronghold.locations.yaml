    description: "The House of Tempered Oaths stands at the heart of Anvilring. Its training courts, armories, chapels, and ceremonial halls are surrounded by orderly barracks streets and shops catering to knights and guards."
    position:
      x: 59.11
      y: 51.59

  - id: "malarthain-021"
    number: 21
